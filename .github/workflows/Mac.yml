name: Build BlackHole Driver

on:
  workflow_dispatch: # 允许你手动点击按钮触发编译
  push:
    tags:
      - 'v*' # 当推送像 v0.7.1 这样的标签时也会自动触发

jobs:
  build:
    runs-on: macos-latest # 使用最新的 macOS 环境

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 获取完整的提交历史，以便脚本能正确读取版本号

      - name: Get version
        id: version
        run: |
          # 从 VERSION 文件读取版本号，作为 pkg 的版本标识
          echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build BlackHole directly (skip signing)
        run: |
          xcodebuild \
            -project BlackHole.xcodeproj \
            -configuration Release \
            -target BlackHole \
            CONFIGURATION_BUILD_DIR=build \
            PRODUCT_BUNDLE_IDENTIFIER=audio.existential.BlackHole2ch \
            GCC_PREPROCESSOR_DEFINITIONS='$GCC_PREPROCESSOR_DEFINITIONS kNumber_Of_Channels=2 kPlugIn_BundleID=\"audio.existential.BlackHole2ch\" kDriver_Name=\"BlackHole\" kDevice_IsHidden=false kDevice_HasInput=true kDevice_HasOutput=true kDevice2_IsHidden=false kDevice2_HasInput=true kDevice2_HasOutput=true' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Verify built driver
        run: |
          # 确认驱动文件确实生成出来了
          ls -la build/
          test -d build/BlackHole.driver

      - name: Create package
        run: |
          # 构造 pkg 的目录结构，把驱动放到正确的位置
          mkdir -p pkgroot/Library/Audio/Plug-Ins/HAL
          cp -R build/BlackHole.driver pkgroot/Library/Audio/Plug-Ins/HAL/
          # 打包成 pkg
          pkgbuild \
            --root pkgroot \
            --identifier audio.existential.BlackHole2ch \
            --version ${{ steps.version.outputs.version }} \
            --install-location / \
            BlackHole2ch.pkg

      - name: Upload the .pkg artifact
        uses: actions/upload-artifact@v5
        with:
          name: BlackHole-Installer
          path: BlackHole2ch.pkg
          if-no-files-found: error
