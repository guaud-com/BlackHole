name: Build BlackHole Driver

on:
  workflow_dispatch: # 允许你手动点击按钮触发编译
  push:
    tags:
      - 'v*' # 当推送像 v0.7.1 这样的标签时也会自动触发

jobs:
  build:
    runs-on: macos-latest # 使用最新的 macOS 环境

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整的提交历史，以便脚本能正确读取版本号

      - name: Make installer script executable
        run: chmod +x Installer/create_installer.sh

      - name: Patch installer script to skip signing
        run: |
          # 在脚本中禁用签名和公证
          sed -i '' 's/^codesign /# codesign /g' Installer/create_installer.sh
          sed -i '' 's/^xcrun notarytool /# xcrun notarytool /g' Installer/create_installer.sh
          sed -i '' 's/^xcrun stapler /# xcrun stapler /g' Installer/create_installer.sh

      - name: Build BlackHole installer (without signing)
        env:
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
          EXPANDED_CODE_SIGN_IDENTITY: ""
        run: ./Installer/create_installer.sh

      - name: Upload the .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackHole-Installer
          path: Installer/BlackHole*.pkg # 捕获所有生成的 pkg 文件
          if-no-files-found: error
